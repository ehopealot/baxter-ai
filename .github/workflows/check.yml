name: check

# Runs the repo's `make check` gate (tsc --noEmit strict + node --test) on every
# push to main and every pull request. The job runs INSIDE the same digest-pinned
# node:22-slim image the agent is built and run on (app/Dockerfile: `FROM
# ${NODE_IMAGE}`), so the check runs under the exact Node the code runs under --
# the GitHub runner's host
# OS/toolchain never enters the picture. That's what "containerized" buys: the gate
# is reproducible regardless of who runs it or on what platform.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the tree.
permissions:
  contents: read

# A newer push to the same branch/PR cancels an in-flight run -- no point spending
# minutes checking a commit that's already been superseded.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Pin the toolchain to the app's own base image so tsc/node --test run under the
    # exact Node the daemon runs under. `make check` never touches the browser
    # layers, so the plain base (not the built app image) is all it needs -- and the
    # built image installs `--omit=dev`, which would drop the very tsc this runs.
    # DIGEST-PINNED to match app/Dockerfile's `ARG NODE_IMAGE` (the source of truth):
    # if CI floated on the mutable `node:22-slim` tag while the image is pinned, a
    # routine Docker Hub republish would silently run the gate under a different
    # Node/Debian patch level than production -- the exact drift the pin prevents.
    # Keep this sha256 in sync when bumping NODE_IMAGE there (same refresh recipe).
    container: node:22-slim@sha256:f576cc608b02e6b04bb0700e13be83eb5ceb7bb24584c3181b0f4ecfa0cd0edf
    steps:
      # node:22-slim is deliberately minimal: install git BEFORE checkout, plus the
      # same python3/make/g++ toolchain app/Dockerfile uses when npm ci builds the
      # better-sqlite3 native addon. gosu runs the gate as the production `node` user.
      - name: Install CI prerequisites
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 make g++ gosu

      - name: Check out the repo
        uses: actions/checkout@v4

      # Mirror the Dockerfile's BuildKit npm cache mount: cache ~/.npm keyed on the
      # exact lockfile, with a loose restore-key so a lockfile bump still warm-starts.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-

      # Full install (NOT --omit=dev like the image build): `make check` needs the dev
      # deps -- typescript (tsc) + @types/node -- that the production image omits.
      # `npm ci` is lockfile-exact and reproducible.
      - name: Install app dependencies
        working-directory: app
        run: |
          set -eu
          npm ci

      # tsc --noEmit (strict) + node --test, exactly as run locally. The container
      # defaults to root, but production runs as `node` and permission tests require
      # non-root semantics. Fails the check (and the PR) on any test/type error.
      - name: make check
        run: gosu node make check

  # Compose interpolation is YAML-parsed AFTER variables are substituted, so a
  # comma-separated BAXTER_SURFACES value is invalid inside a flow mapping. Parse
  # the tenant-style surface list in CI without starting or pulling any container.
  compose-config:
    runs-on: ubuntu-latest
    env:
      PROJECT: baxter-ci
      APP_IMAGE: baxter-ci-app
      BASE_ENV: /dev/null
      BASE_SECRETS_ENV: /dev/null
      TENANT_ENV: /dev/null
      TENANT_STATE: /tmp
      COMPOSE_PROFILES: light
      BAXTER_SURFACES: mail,sms,heartbeat,home
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration with tenant surface list
        run: |
          set -euo pipefail
          docker compose config -q
          docker compose config --format json > /tmp/compose-config.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('/tmp/compose-config.json', 'utf8'));
          assert.deepEqual(config.services.light.environment, {
            BAXTER_SURFACES: 'mail,sms,heartbeat,home',
            DISCORD_LOG_SURFACE: 'light',
          });
          NODE
