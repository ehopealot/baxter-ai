name: release

# Cut a GitHub Release automatically whenever a semver tag (vX.Y.Z) is pushed.
# So the whole release flow is: `make release VERSION=vX.Y.Z` (tags + pushes) -> this
# fires -> a Release with generated notes appears. A tag containing a hyphen
# (v1.2.0-rc1) is published as a pre-release, so it never becomes /releases/latest.
on:
  push:
    tags:
      - "v[0-9]*" # semver tags only -- a stray `vnext`/`vtest` must never make a Release

permissions:
  contents: write # required for GITHUB_TOKEN to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No checkout needed: `gh release create --generate-notes --repo` diffs against the
      # prior tag SERVER-SIDE (the generate_release_notes API), never the local clone.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$tag" \
            --generate-notes \
            $prerelease
