# Baxter's runtime fleet, run via `make run` / `make stop`.
#
# The Makefile BUILDS the images (arch-specific codapi binary, the two sandbox
# images, the app image) and owns the durable resources (the shared network and
# the config volume, both `external` below); compose only *runs* the containers.
# So a bare `docker compose up` would try to pull the images and fail -- always
# go through the Makefile, which builds first and exports the vars this file
# needs.
#
# ${PROJECT} / ${CODAPI_TMP} and the project name come from the environment the
# Makefile exports, so the same file yields app-* containers in the dev sandbox
# and baxter-* on the host (PROJECT = the repo directory name).
#
# ${APP_IMAGE} / ${CODAPI_IMAGE} are the SHARED, tenant-agnostic image tags the
# Makefile exports (baxter-app[-voice] / baxter-codapi) -- the image bakes in no
# tenant data, so every tenant on a box runs the SAME image. Only the containers,
# network and config volume are ${PROJECT}-scoped (per-tenant); the images are not.

services:
  # Offline code-execution sandbox. Holds the docker socket to launch hardened
  # sandbox siblings (NOT privileged). The service name `codapi` is its network
  # alias, so code-cli's http://codapi:1313 resolves from every service here.
  # TMPDIR is bind-mounted at an identical host path so codapi's per-run code
  # dir resolves on the host daemon (docker-outside-of-docker). Holds no secrets.
  codapi:
    image: ${CODAPI_IMAGE:?run via the Makefile (make run), not bare docker compose}
    container_name: ${PROJECT}-codapi-svc
    restart: unless-stopped
    volumes:
      # Stage 1 seam: which daemon socket codapi drives. Default = the host ROOT
      # daemon (today's behavior). A hardened box points this at a ROOTLESS
      # daemon's socket (/run/user/<uid>/docker.sock) so a codapi compromise is
      # an unprivileged namespace, not host root -- OR at a body-inspecting authz
      # proxy's socket (Stage 2b). Always presented to codapi at the fixed path.
      # Set CODAPI_DOCKER_SOCK in the environment (compose interpolates ambient
      # ${...}); unset => unchanged. See docs/architecture/codapi-hardening-ops.md.
      - ${CODAPI_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${CODAPI_TMP:?run via the Makefile (make run), not bare docker compose}:${CODAPI_TMP}
    environment:
      TMPDIR: ${CODAPI_TMP}
    # Stage 0 hardening (docs/superpowers/specs/2026-07-28-codapi-sandbox-hardening-design.md):
    # defense-in-depth on the codapi SERVER. It needs NO host caps of its own --
    # container-launch privilege comes from the docker socket, not local caps -- so
    # drop them all. no-new-privileges blocks setuid escalation; the pids/mem caps
    # bound a runaway. NOTE: this does NOT fix the socket being root-equivalent --
    # that is Stage 1 (rootless socket). read_only rootfs + non-root codapi are
    # deferred to a box-verified follow-up (codapi is `docker:cli`, may write to
    # HOME/.docker + /tmp; needs a live check before enabling).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g

  # Web-search backend for `web-cli search` (scripts/web-cli.ts): a self-hosted
  # SearXNG whose JSON API aggregates upstream engines, so the structured-tool
  # harnesses get real search instead of Bing-in-a-browser. Service name `searxng`
  # is its network alias, so web-cli's http://searxng:8080 resolves from every
  # service here (like codapi). Gated behind the `search` profile, which the
  # Makefile activates by default (SEARXNG_LOCAL=1) -- so single-tenant search is
  # always-on. A multi-tenant box instead runs ONE shared instance and points
  # tenants at it via SEARXNG_URL (searxng is stateless -> safe to share; set
  # SEARXNG_LOCAL=0 to skip this per-tenant container). Holds no secret; settings
  # are mounted read-only. Not fetched via guardUrl -- web-cli reaches it by the
  # fixed env host, same as code-cli/data-cli reach their internal services.
  #
  # Hardening: runs as the image's non-root `searxng` user (uid 977) with ALL caps
  # dropped + no-new-privileges. NOTE the image entrypoint does NOT drop privileges
  # on its own -- by default it runs as root; we force non-root here. Verified this
  # still serves the JSON API: the entrypoint's root-time file setup (chown/copy) is
  # skipped because settings.yml is already present (our read-only mount). Pinned by
  # digest -- that "settings present -> don't rewrite" behavior is entrypoint- and
  # version-dependent, and an unexpected :latest bump could regress the ro-mount
  # assumption. Re-pin with `docker pull searxng/searxng && docker inspect ...`.
  searxng:
    image: searxng/searxng@sha256:5d6d903ab82afa56ee32792d477f36bc63d3e5ca04fcb6947e28a5cfd987fad3
    container_name: ${PROJECT}-searxng
    profiles: ["search"]
    restart: unless-stopped
    user: searxng
    volumes:
      # `z` (lowercase = SHARED label) relabels the file for container access on
      # SELinux-enforcing hosts (Fedora) -- without it the container's stat/read is
      # denied and searxng crash-loops ("settings.yml ... not a valid file"). This is
      # the first bind mount from the core checkout (app services mount the labeled
      # /agents tree, codapi the socket), so it's the only one that needs it. MUST be
      # lowercase `z`: multiple per-tenant searxng containers mount this SAME host file,
      # and `:Z` (private) would let only one of them read it. No-op off SELinux.
      - ./app/searxng/settings.yml:/etc/searxng/settings.yml:ro,z
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  # Resend mail surface daemon (image default CMD = scripts/mail-bot.ts). OPT-IN:
  # gated behind the `mail` profile; it handles the mail surface inside the
  # container when BAXTER_SURFACES includes `mail`. There is no separate poll
  # loop; `make run-mail` enables the profile. See the README.
  run:
    image: ${APP_IMAGE}
    init: true  # tini as PID1: reap zombie browser children a crashed invisible-cli daemon leaves behind
    container_name: ${PROJECT}-run
    profiles: ["mail"]
    restart: unless-stopped
    depends_on: [codapi]
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    # Selects DISCORD_LOG_WEBHOOK_MAIL from app/.env for the log mirror (a literal,
    # since compose ${} can't read env_file). See runtime.ts's shipper.
    environment: { DISCORD_LOG_SURFACE: mail }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g

  # Discord gateway.
  discord:
    image: ${APP_IMAGE}
    init: true  # tini as PID1: reap zombie browser children a crashed invisible-cli daemon leaves behind
    container_name: ${PROJECT}-discord
    # Profiled so a fleet can select its surfaces via BAXTER_SURFACES (the
    # Makefile maps it to COMPOSE_PROFILES). Default set includes `discord`, so
    # a plain `make run` still starts it -- see the Makefile's BAXTER_SURFACES.
    profiles: ["discord"]
    restart: unless-stopped
    depends_on: [codapi]
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    environment: { DISCORD_LOG_SURFACE: discord }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node scripts/discord-bot.ts

  # Heartbeat scheduler.
  heartbeat:
    image: ${APP_IMAGE}
    init: true  # tini as PID1: reap zombie browser children a crashed invisible-cli daemon leaves behind
    container_name: ${PROJECT}-heartbeat
    profiles: ["heartbeat"]   # selectable via BAXTER_SURFACES; in the default set
    restart: unless-stopped
    depends_on: [codapi]
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    environment: { DISCORD_LOG_SURFACE: heartbeat }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node scripts/heartbeat.ts

  # Family-home web surface (scripts/home-bot.ts). OPT-IN, gated behind the `home`
  # profile (add `home` to BAXTER_SURFACES). Not tied to Discord -- it drives the
  # control-plane Durable Object that serves one web page per family (checklists +
  # tap-to-check). Idles cleanly if home-keys.json is absent (logs once, no crash).
  # No voice-style image variant needed; a plain image runs it.
  home:
    image: ${APP_IMAGE}
    init: true  # tini as PID1 so `docker stop` reaches Node promptly (a bare PID1 ignores SIGTERM) -- no child processes here to reap
    container_name: ${PROJECT}-home
    profiles: ["home"]
    restart: unless-stopped
    # No depends_on: a lean sync loop -- it never runs CODE or a browser (so it needs neither
    # codapi nor the browser stack) and never spawns an agent RUN. It can be the ONLY surface a
    # tenant runs. It DOES make scoped outbound HTTPS calls -- calendar-feed polling, and one
    # OpenRouter completion for checklist Sort/Group -- so it loads the same model env the other
    # surfaces do, but with no run subprocess memory stays small.
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    environment: { DISCORD_LOG_SURFACE: home }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 512m  # a small Node sync loop, not an agent-running surface
    command: node scripts/home-bot.ts

  # SMS surface (scripts/sms-bot.ts). OPT-IN, gated behind the `sms` profile (add `sms`
  # to BAXTER_SURFACES). Holds one persistent SigV4-signed link to the control-plane
  # Durable Object (dialing /sms-link), wakes a SCOPED agent run per inbound text, and
  # replies via sms-cli (the daemon holds the Sendblue creds; the run never sees them).
  # Idles cleanly if home-keys.json is absent (logs once, no crash). Runs scoped agent
  # runs, so -- like discord -- it needs codapi + the full image resources.
  sms:
    image: ${APP_IMAGE}
    init: true  # tini as PID1: reap zombie browser children a crashed invisible-cli daemon leaves behind
    container_name: ${PROJECT}-sms
    profiles: ["sms"]
    restart: unless-stopped
    depends_on: [codapi]
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    environment: { DISCORD_LOG_SURFACE: sms }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node scripts/sms-bot.ts

  # Home Chats surface (scripts/chat-bot.ts). OPT-IN, gated behind the `chat` profile
  # (add `chat` to BAXTER_SURFACES). Holds one persistent SigV4-signed link to the
  # control-plane Durable Object (dialing /chat-link, separate from /sms-link and the
  # checklist /link), drains create-chat/send-message intents the DO relays from the
  # browser, and replies via chat-cli (straight to the container-side transcript, no
  # external provider/creds -- unlike sms it needs no Sendblue key). Idles cleanly if
  # home-keys.json is absent (logs once, no crash). Runs scoped agent runs, so --
  # like sms/discord -- it needs codapi + the full image resources.
  chat:
    image: ${APP_IMAGE}
    init: true  # tini as PID1: reap zombie browser children a crashed invisible-cli daemon leaves behind
    container_name: ${PROJECT}-chat
    profiles: ["chat"]
    restart: unless-stopped
    depends_on: [codapi]
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    environment: { DISCORD_LOG_SURFACE: chat }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node scripts/chat-bot.ts

  # "Fast Baxter" voice surface (scripts/voice-bot.ts). OPT-IN, gated behind the
  # `voice` profile: a DEFAULT `make run`/`run-mail` does NOT start it. It starts
  # when `voice` is in BAXTER_SURFACES WITH VOICE=1 (the image needs the ~1GB voice
  # stack; check-surfaces rejects voice+VOICE!=1), or standalone via `make voice`.
  # Experimental; self-disables (exit 0) unless DISCORD_VOICE_CHANNEL_ID is set.
  voice:
    image: ${APP_IMAGE}
    init: true  # tini as PID1: reap zombie browser children a crashed invisible-cli daemon leaves behind
    container_name: ${PROJECT}-voice
    profiles: ["voice"]
    # on-failure (not unless-stopped): the documented exit-0 self-disable (no
    # DISCORD_VOICE_CHANNEL_ID) then stays DOWN instead of flapping forever, while a
    # real crash (login failure, uncaught error) still restarts. Trade-off:
    # on-failure does NOT survive a Docker daemon / Colima restart -- after a host
    # reboot, re-run `make voice` (the rest of the fleet comes back on its own).
    restart: on-failure
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
    environment: { DISCORD_LOG_SURFACE: voice }
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node scripts/voice-bot.ts

# Durable resources compose treats as external -- the Makefile (`ensure` target,
# which `make run`/`run-mail` depend on) creates them, and `docker compose down`
# leaves them intact.
networks:
  default:
    name: ${PROJECT}-net
    external: true

volumes:
  config:
    name: ${PROJECT}-app-config
    external: true
