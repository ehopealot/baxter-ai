# Baxter's tenant runtime. The Makefile builds the shared app image and owns the
# external tenant network/config volume; Compose only runs the selected services.
# Code execution is remote-only: this file intentionally has no Codapi service,
# sandbox image, or Docker socket mount.

services:
  # Per-tenant search stays local; it is unrelated to remote code execution.
  searxng:
    image: searxng/searxng@sha256:5d6d903ab82afa56ee32792d477f36bc63d3e5ca04fcb6947e28a5cfd987fad3
    container_name: ${PROJECT}-searxng
    profiles: ["search"]
    restart: unless-stopped
    user: searxng
    volumes:
      - ./app/searxng/settings.yml:/etc/searxng/settings.yml:ro,z
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  discord:
    image: ${APP_IMAGE}
    init: true
    container_name: ${PROJECT}-discord
    profiles: ["discord"]
    restart: unless-stopped
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
      - path: ${CODE_EXECUTOR_ENV:-app/code-executor.env}
        required: false
    environment:
      DISCORD_LOG_SURFACE: discord
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node --import ./scripts/drain-startup-alert-hook.ts scripts/discord-bot.ts

  # Consolidated mail/home/heartbeat/sms/chat daemon container.
  light:
    image: ${APP_IMAGE}
    init: true
    container_name: ${PROJECT}-light
    profiles: ["light"]
    restart: unless-stopped
    env_file:
      - path: ${BASE_ENV:-app/base.env}
        required: false
      - path: ${BASE_SECRETS_ENV:-app/base-secrets.env}
        required: false
      - path: ${TENANT_ENV:-app/.env}
      - path: ${CODE_EXECUTOR_ENV:-app/code-executor.env}
        required: false
    environment:
      DISCORD_LOG_SURFACE: light
      BAXTER_SURFACES: ${BAXTER_SURFACES}
    volumes:
      - "${TENANT_STATE:-config}:/home/node"
    mem_limit: 8g
    shm_size: 2g
    command: node --import ./scripts/drain-startup-alert-hook.ts scripts/light-bot.ts

# The tenant network/config volume are externally created by Make.
networks:
  default:
    name: ${PROJECT}-net
    external: true

volumes:
  config:
    name: ${PROJECT}-app-config
    external: true
